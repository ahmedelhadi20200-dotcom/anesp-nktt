<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANESP – NKTT Sud, fiche de suivi</title>
<style>

:root{--bg:#eef1ef;--card:#fff;--ink:#17262b;--mute:#5d6f74;--line:#d5dcda;--acc:#0f6b73;--accs:#d9ecee;--ok:#2f7d4f;--warn:#b45309;--bad:#b42318;--bar:#dfe6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181b;--card:#182327;--ink:#e6eeee;--mute:#93a6aa;--line:#2b3a3e;--acc:#5cc2cb;--accs:#17383c;--ok:#6cc58d;--warn:#f0a04b;--bad:#f28b82;--bar:#26353a}}
:root[data-theme="dark"]{--bg:#10181b;--card:#182327;--ink:#e6eeee;--mute:#93a6aa;--line:#2b3a3e;--acc:#5cc2cb;--accs:#17383c;--ok:#6cc58d;--warn:#f0a04b;--bad:#f28b82;--bar:#26353a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.global{background:var(--acc);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
:root[data-theme="dark"] .global,:root:not([data-theme="light"]) .global{color:#06272b}
.global .big{font-size:2.4rem;font-weight:700;line-height:1}
.global .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.global small{opacity:.9}
.gbar{height:8px;border-radius:4px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.gbar i{display:block;height:100%;background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .tabs button[aria-pressed="true"],:root:not([data-theme="light"]) .tabs button[aria-pressed="true"]{color:#06272b}
.site{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.site:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:650}
.co{color:var(--mute);font-size:.86rem}
.pct{font-weight:700;font-size:1.15rem;white-space:nowrap}
.bar{position:relative;height:9px;background:var(--bar);border-radius:5px;margin:10px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--acc)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);align-items:center}
.tag{border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:600;background:var(--accs);color:var(--acc)}
.tag.stop{background:rgba(180,35,24,.12);color:var(--bad)}
.tag.none{background:var(--bar);color:var(--mute)}
.tag.late{background:rgba(180,83,9,.14);color:var(--warn)}
.tag.done{background:rgba(47,125,79,.14);color:var(--ok)}
.upd{font-size:.76rem;color:var(--mute);margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.panel h2{margin:0 0 2px;font-size:1.15rem}
.info{font-size:.85rem;color:var(--mute);margin:2px 0}
.info a{color:var(--acc)}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06272b}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px;font-weight:600}
.btn:disabled{opacity:.5}
.base{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.84rem;color:var(--mute);margin-top:10px;white-space:pre-line}
.note{font-size:.82rem;color:var(--mute);margin:12px 0}
.msg{font-size:.85rem;margin-top:10px;min-height:1.2em}
.foot{display:flex;gap:8px;margin:6px 0 28px}
.foot button{flex:1}

.sub2{font-size:.85rem;color:var(--mute);margin:8px 0 0}.btn.wa{background:#1f9d55;color:#fff!important}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sent{font-size:.76rem;color:var(--ok);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <p class="sub" style="margin:0 0 6px;font-weight:600;color:var(--acc)">Ing. Ahmed El Hady – ANESP</p>
  <h1>NKTT Sud – Fiche de suivi des chantiers</h1>
  <p class="sub">Choisissez le chantier, remplissez la fiche, ajoutez les photos, puis envoyez-la sur WhatsApp.</p>
  <div class="global"><div class="row"><div><small>Avancement global</small><div class="big" id="gpct">–</div></div><small id="gcount"></small></div><div class="gbar"><i id="gbar" style="width:0"></i></div></div>
  <div id="list"></div>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
// Numéro WhatsApp qui reçoit les fiches, format international sans « + » (ex. "22212345678"). Laisser vide pour choisir le contact à chaque envoi.
var WA_NUMBER="22241129072";
var SITES=[
{id:"s01",n:"École Cheikh Med El Hafedh (redéployée à Lemrabot Sidi Mahmoud)",z:"Arafat",e:"E2PC",t:"34162252",i:"Extension d’un bloc de 6 SDC",c:[18.060792,-15.943324],r:"30/10/2026",d:.029,av:0,s:"Non entamé",o:"Espace suffisant pour 6 SDC."},
{id:"s02",n:"École en face du quartier PK 15",z:"El Mina – PK 15",e:"EL BARAKA",t:"22615125",i:"12 SDC + administration + toilettes + loge + clôture",c:[17.952359,-15.980966],r:"10/09/2026",d:.2375,av:.16,s:"Arrêté",o:"Travaux arrêtés par le maître d’ouvrage après le coulage des semelles (proximité des éoliennes)."},
{id:"s03",n:"École Hay El Wehda",z:"Riyad – Tarhil 17",e:"EL BARAKA",t:"22615125",i:"12 SDC + administration + toilettes + loge + clôture",c:[17.9984,-15.937424],r:"17/09/2026",d:.2083,av:.10,s:"En cours",o:"Fondations du bloc 1 achevées. Longrines du bloc 2 et semelles du bloc administratif en cours. Soubassement du logement du directeur en cours."},
{id:"s04",n:"Collège SANFICH",z:"El Mina – Dar El Beidha",e:"CHADAD GROUP",t:"36308180",i:"Collège 8 SDC + annexes",c:[18.012797,-15.997125],r:"14/09/2026",d:.2208,av:.42,s:"En cours",o:"Élévation en cours (classes, bloc technique, administration, logement). Chaînage bas de clôture achevé."},
{id:"s05",n:"École Djambour",z:"El Mina – PK 15",e:"CHADAD GROUP",t:"36308180",i:"École 12 SDC + annexes",c:[17.952359,-15.980966],r:"30/10/2026",d:0,av:0,s:"Non entamé",o:"Emprise L=125 m, l=50 m, suffisante."},
{id:"s06",n:"École Jedou Saleck",z:"Riyad",e:"GHAZALI",t:"36303787",i:"8 SDC + administration + toilettes + loge + clôture",c:[18.010823,-15.955792],r:"05/09/2026",d:.2583,av:.38,s:"En cours",o:"Chaînage haut en cours pour le bloc de classes. Emprise restreinte."},
{id:"s07",n:"École Mohamed Ibrahim",z:"Riyad – Tarhil 16",e:"GHAZALI",t:"37303787",i:"12 SDC + administration + toilettes + loge + clôture",c:[18.007776,-15.946638],r:"05/09/2026",d:.2583,av:0,s:"Non entamé",o:"Espace suffisant."},
{id:"s08",n:"École Abdallahi Ibn Messaoud",z:"Riyad",e:"E2PC",t:"34162252",i:"Extension d’un bloc de 6 SDC",c:[17.933657,-15.981071],r:"12/08/2026",d:.3583,av:.08,s:"Arrêté",o:"Fouilles des semelles en cours. Chantier à l’arrêt depuis 15 jours. Emprise très limitée."},
{id:"s09",n:"Collège 2",z:"Riyad",e:"HYBAT-TP",t:"27508908",i:"Extension d’un bloc de 6 SDC",c:[18.014953,-15.9705553],r:"01/10/2026",d:.15,av:.12,s:"En cours",o:"Coulage des semelles en cours."},
{id:"s10",n:"École Arafat 2",z:"El Mina – Netegue",e:"HYBAT-TP",t:"27508908",i:"Construction d’un mur de clôture",c:[18.061558,-15.997708],r:"01/10/2026",d:.15,av:0,s:"Non entamé",o:"Remise de site effectuée."},
{id:"s11",n:"Collège Hay Samia",z:"El Mina – Tarhil PK 13",e:"CECTP",t:"36350720",i:"Collège 8 SDC + annexes",c:[17.969442,-15.976903],r:"30/10/2026",d:.029,av:0,s:"Non entamé",o:"Étude géotechnique en cours."},
{id:"s12",n:"Lycée Hay Samia",z:"El Mina – Dar El Beida",e:"SOMACOR",t:"22443054",i:"Lycée 8 SDC + annexes",c:[18.06118,-15.977787],r:"21/10/2026",d:.0667,av:0,s:"Non entamé",o:"Remise de site effectuée."},
{id:"s13",n:"École El Velouja",z:"Arafat",e:"SOMACOR",t:"22443054",i:"École 12 SDC + annexes",c:[18.046593,-15.948466],r:"22/09/2026",d:.1875,av:.12,s:"En cours",o:"Soubassement du bloc de 6 classes en cours. Emprise L=80 m, l=50 m."},
{id:"s14",n:"École Oum El Mouminine",z:"Arafat",e:"ITKAN POUR L’ING",t:"30744898",i:"Construction de 8 SDC et mur de clôture",c:[18.07361,-15.95278],r:"14/08/2026",d:.35,av:.65,s:"En cours",o:"Élévation à l’étage du bloc de 8 classes et du mur de clôture."}
];
var ETATS=["Non entamé","En cours","Arrêté","Terminé"];
var $=function(i){return document.getElementById(i)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var sent={};try{sent=JSON.parse(LS.get("nktt_sent")||"{}")}catch(e){}
var last={};try{last=JSON.parse(LS.get("nktt_last")||"{}")}catch(e){}
function cur(s){var m=last[s.id];return m?{av:m.av,s:m.s}:{av:s.av,s:s.s}}
var openId=null,gps=null,photos=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pc(x){return Math.round(x*100)+" %"}
function tagCls(e){return e==="Arrêté"?"stop":e==="Non entamé"?"none":e==="Terminé"?"done":""}
function render(){
  var t=0,n={};SITES.forEach(function(s){var c=cur(s);t+=c.av;n[c.s]=(n[c.s]||0)+1});
  var g=t/SITES.length;$("gpct").textContent=(g*100).toFixed(1).replace(".",",")+" %";$("gbar").style.width=(g*100)+"%";
  $("gcount").textContent=SITES.length+" chantiers – "+(n["En cours"]||0)+" en cours, "+(n["Arrêté"]||0)+" arrêtés, "+(n["Non entamé"]||0)+" non entamés";
  $("list").innerHTML=SITES.map(function(s){
    var c=cur(s),late=(s.d-c.av)>=.15;
    return '<button type="button" class="site" data-id="'+s.id+'"><div class="top"><div><div class="nm">'+esc(s.n)+'</div><div class="co">'+esc(s.e)+' – '+esc(s.z)+'</div></div><div class="pct">'+pc(c.av)+'</div></div><div class="bar"><i style="width:'+(c.av*100)+'%"></i><b style="left:'+Math.min(100,s.d*100)+'%"></b></div><div class="meta"><span class="tag '+tagCls(c.s)+'">'+esc(c.s)+'</span>'+(late?'<span class="tag late">Retard</span>':'')+'<span>Délai consommé '+pc(s.d)+'</span></div>'+(sent[s.id]?'<div class="sent">Dernier envoi : '+esc(sent[s.id])+'</div>':'')+'</button>';
  }).join("");
}
function site(){return SITES.filter(function(x){return x.id===openId})[0]}
function openSite(id){
  openId=id;gps=null;photos=[];var s=site(),c=cur(s),today=new Date().toISOString().slice(0,10);
  $("panel").innerHTML='<h2>'+esc(s.n)+'</h2><p class="info">'+esc(s.e)+' – <a href="tel:'+s.t+'">'+s.t.replace(/(\d\d)(?=\d)/g,"$1 ")+'</a></p><p class="info">'+esc(s.i)+'</p><p class="info">Remise de site : '+s.r+'</p><div class="base">Situation au 06/11/2026 : '+pc(s.av)+' – '+esc(s.s)+'\n'+esc(s.o)+'</div>'+
  '<label for="f_av">Avancement global (%)</label><input id="f_av" type="number" inputmode="numeric" min="0" max="100" value="'+Math.round(c.av*100)+'">'+
  '<div class="two"><div><label for="f_et">État du chantier</label><select id="f_et">'+ETATS.map(function(e){return '<option'+(e===c.s?' selected':'')+'>'+e+'</option>'}).join("")+'</select></div><div><label for="f_ef">Ouvriers présents</label><input id="f_ef" type="number" inputmode="numeric" min="0"></div></div>'+
  '<div class="two"><div><label for="f_dt">Date de visite</label><input id="f_dt" type="date" value="'+today+'"></div><div><label for="f_by">Technicien</label><input id="f_by" type="text" autocomplete="name" value="'+esc(LS.get("nktt_tech")||"")+'"></div></div>'+
  '<label for="f_ob">Observations (travaux en cours, problèmes)</label><textarea id="f_ob"></textarea>'+
  '<label for="f_ph">Photos du chantier</label><input id="f_ph" type="file" accept="image/*" multiple><div class="info" id="phc"></div>'+
  '<button class="btn wa" id="wa" type="button">Envoyer sur WhatsApp</button>'+
  '<div class="row2"><button class="btn ghost" id="cp" type="button">Copier le message</button><button class="btn ghost" id="close" type="button">Fermer</button></div><div class="msg" id="msg" role="status"></div>';
  $("sheet").classList.add("open");
}
function message(){
  var s=site(),av=parseFloat($("f_av").value);
  if(isNaN(av)||av<0||av>100){$("msg").textContent="L’avancement doit être entre 0 et 100.";return null}
  if(!$("f_by").value.trim()){$("msg").textContent="Indiquez le nom du technicien.";return null}
  LS.set("nktt_tech",$("f_by").value.trim());
  var d=$("f_dt").value.split("-").reverse().join("/");
  var L=["*ANESP – NKTT Sud – Fiche de suivi*","Chantier : "+s.n,"Entreprise : "+s.e,"Zone : "+s.z,"Date de visite : "+d,"Avancement : "+Math.round(av)+" %","État : "+$("f_et").value,"Ouvriers présents : "+($("f_ef").value||"non renseigné"),"Technicien : "+$("f_by").value.trim(),"Observations : "+($("f_ob").value.trim()||"néant")];
  L.push("Position du chantier : https://www.google.com/maps?q="+s.c[0]+","+s.c[1]);
  return L.join("\n");
}
function mark(){
  sent[openId]=new Date().toLocaleString("fr-FR");LS.set("nktt_sent",JSON.stringify(sent));
  var a=parseFloat($("f_av").value);if(!isNaN(a)){last[openId]={av:a/100,s:$("f_et").value};LS.set("nktt_last",JSON.stringify(last))}
  render();
}
function sendWA(){
  var m=message();if(!m)return;
  if(photos.length&&navigator.canShare&&navigator.canShare({files:photos})){
    navigator.share({files:photos,text:m,title:"ANESP – NKTT Sud"}).then(mark).catch(function(e){if(e&&e.name!=="AbortError")$("msg").textContent="Partage impossible. Touchez « Copier le message » puis joignez les photos dans WhatsApp."});
    return;
  }
  if(photos.length)alert("Les photos ne peuvent pas être jointes automatiquement sur cet appareil. Après l’ouverture de WhatsApp, joignez-les à la main.");
  mark();window.location.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(m);
}
function shrink(f,n){
  return new Promise(function(res){
    var img=new Image(),u=URL.createObjectURL(f);
    img.onload=function(){
      var k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){res(new File([b],"chantier_"+openId+"_"+n+".jpg",{type:"image/jpeg"}))},"image/jpeg",.75);
    };
    img.onerror=function(){URL.revokeObjectURL(u);res(null)};
    img.src=u;
  });
}
function addPhotos(list){
  var arr=[].slice.call(list),i=photos.length;
  $("phc").textContent="Préparation des photos…";
  Promise.all(arr.map(function(f,j){return shrink(f,i+j+1)})).then(function(r){
    r.forEach(function(x){if(x)photos.push(x)});
    $("phc").textContent=photos.length+" photo"+(photos.length>1?"s":"")+" prête"+(photos.length>1?"s":"");
  });
}
function copyMsg(){
  var m=message();if(!m)return;
  function ok(){mark();$("msg").textContent="Message copié. Collez-le dans WhatsApp."}
  function fb(){var t=document.createElement("textarea");t.value=m;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){$("msg").textContent="Copie impossible."}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(m).then(ok,fb)}else{fb()}
}
function closeSheet(){$("sheet").classList.remove("open");openId=null}
document.addEventListener("change",function(e){if(e.target.id==="f_ph")addPhotos(e.target.files)});
document.addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!t){if(e.target.id==="sheet")closeSheet();return}
  if(t.classList.contains("site"))openSite(t.dataset.id);
  else if(t.id==="wa")sendWA();else if(t.id==="cp")copyMsg();else if(t.id==="close")closeSheet();
});
render();
</script>
</body>
</html>
